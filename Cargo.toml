[workspace]
resolver = "3"
members = ["crates/frame", "crates/frame_diagnostics", "crates/frame_driver", "crates/frame_source", "crates/frame_syntax"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
